services:
  # --------------------------------------------------------------------------
  # ShoeStop Backend API (Dockerized Node.js / Express)
  # --------------------------------------------------------------------------
  - type: web
    name: shoestop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: expiry
        value: 30d
      - key: mongoURI
        sync: false

  # --------------------------------------------------------------------------
  # ShoeStop Frontend (Dockerized React / Vite + Nginx)
  # --------------------------------------------------------------------------
  - type: web
    name: shoestop-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shoestop-backend
          property: host
